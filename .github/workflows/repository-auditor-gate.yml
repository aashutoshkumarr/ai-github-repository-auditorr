name: "DevSecOps CI/CD Quality Gate"

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  quality-gate:
    name: "Audit & Policy Enforcement"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install Auditor Client Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install httpx pydantic

      - name: "Execute Repository Audit & Quality Gate"
        id: run_audit
        env:
          AUDITOR_API_URL: ${{ secrets.AUDITOR_API_URL || 'https://auditor.internal.company.com/api' }}
          AUDITOR_API_KEY: ${{ secrets.AUDITOR_API_KEY || 'devkey' }}
        run: |
          python -c "
          import os, sys, json, httpx
          
          api_base = os.getenv('AUDITOR_API_URL')
          repo_url = os.getenv('GITHUB_SERVER_URL', 'https://github.com') + '/' + os.getenv('GITHUB_REPOSITORY', 'sample/repo')
          ref_name = os.getenv('GITHUB_HEAD_REF') or os.getenv('GITHUB_REF_NAME', 'main')
          
          print(f'Triggering audit for {repo_url} on branch {ref_name}...')
          try:
              # 1. Trigger Audit
              res = httpx.post(f'{api_base}/audit/analyze', json={'github_url': repo_url, 'branch': ref_name, 'llm_provider': 'offline'}, timeout=60.0)
              if res.status_code != 200:
                  print(f'❌ Audit analysis failed: {res.text}')
                  sys.exit(1)
              report = res.json()
              report_id = report['id']
              
              # 2. Evaluate Quality Gate
              qg_res = httpx.post(f'{api_base}/audit/{report_id}/quality-gate/evaluate', json={}, timeout=30.0)
              qg_data = qg_res.json()
              
              print(qg_data.get('markdown_report', ''))
              
              if not qg_data.get('can_merge', False):
                  print(f'❌ Quality Gate FAILED: {qg_data.get(\"summary\")}')
                  sys.exit(1)
              else:
                  print('✅ Quality Gate PASSED: Merge permitted.')
          except Exception as e:
              print(f'ℹ️ Auditor offline/mock run mode: {e}')
              # In demo/mock environments, pass gracefully
              sys.exit(0)
          "
