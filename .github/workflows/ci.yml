name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # --------------------------------------------------
      # Backend dependencies
      # --------------------------------------------------
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      # --------------------------------------------------
      # Backend tests
      # Use SQLite in CI so tests do not require PostgreSQL
      # --------------------------------------------------
      - name: Run backend tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./backend/storage/auditor_ci.db
        run: |
          python -m pytest -q backend/tests

      # --------------------------------------------------
      # Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --------------------------------------------------
      # Frontend build
      # --------------------------------------------------
      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build --silent

      # --------------------------------------------------
      # Verify Docker build context
      # --------------------------------------------------
      - name: Verify Docker build context
        run: |
          echo "GitHub workspace:"
          echo "$GITHUB_WORKSPACE"

          echo "Checking required files..."

          test -f "$GITHUB_WORKSPACE/Dockerfile"
          echo "✅ Dockerfile exists"

          test -f "$GITHUB_WORKSPACE/backend/requirements.txt"
          echo "✅ backend/requirements.txt exists"

          test -f "$GITHUB_WORKSPACE/backend/sandbox/Dockerfile"
          echo "✅ backend/sandbox/Dockerfile exists"

      # --------------------------------------------------
      # Build Docker images
      # Explicitly use GitHub workspace as build context
      # --------------------------------------------------
      - name: Build Docker images (CI tags)
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -t auditor-backend:ci \
            -f "$GITHUB_WORKSPACE/Dockerfile" \
            "$GITHUB_WORKSPACE"

          docker build \
            --no-cache \
            --progress=plain \
            -t auditor-sandbox:ci \
            -f "$GITHUB_WORKSPACE/backend/sandbox/Dockerfile" \
            "$GITHUB_WORKSPACE"

      # --------------------------------------------------
      # Upload artifacts
      # --------------------------------------------------
      - name: Upload artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          if-no-files-found: ignore
          path: |
            ./frontend/.next
            ./backend